<!doctype html>
<!--
  A hackathon's link-preview poster, 1200×630 (design B, chosen 2026-11-11).
  hackmash/og/render.py loads this page once in headless Chromium, then calls
  window.render(card) for each hackathon and screenshots it. Nothing here may
  reach the network: logos arrive as data: URIs, and the policy below forbids
  everything else.
-->

  box-shadow: 0 3px 4px rgb(52 28 6 / 0.22), 0 34px 48px -22px rgb(52 28 6 / 0.7); display: flex; flex-direction: column; }
.poster > .pin { --pin: 32px; left: calc(50% - 16px); top: -12px; }
.head { display: flex; align-items: center; gap: 18px; padding-right: 230px; min-height: 64px; }
.head img { width: 64px; height: 64px; border-radius: 8px; border: 1px solid var(--ink-line); flex: none; object-fit: contain; background: #fff; }
.letter { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

<body>
<div id="card"></div>
<script>
const ICONS = {
  calendar: '<path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/>',
  pin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><path d="M16 3.128a4 4 0 0 1 0 7.744"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><circle cx="9" cy="7" r="4"/>',
};
const icon = (name) => `<svg class="icon" viewBox="0 0 24 24">${ICONS[name]}</svg>`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

/** Shrink text until it fits `height` px; past `min`, cut it at whole lines with an ellipsis. */
function fit(el, max, min, height) {
  let size = max;
  el.style.fontSize = `${size}px`;
  while (size > min && el.scrollHeight > height + 1) el.style.fontSize = `${--size}px`;
  if (el.scrollHeight > height + 1) {
    el.classList.add("clamp");
    el.style.webkitLineClamp = String(Math.max(1, Math.floor(height / parseFloat(getComputedStyle(el).lineHeight))));
  }
}

function fitLine(el, max, min) {
  let size = max;
  el.style.fontSize = `${size}px`;
  while (size > min && el.scrollWidth > el.clientWidth) el.style.fontSize = `${--size}px`;
}

/** Draw one hackathon. `D` is a share.Card as a dict, plus `logo` (a data: URI or null). */
window.render = async (D) => {
  const facts = [
    D.when && `<span>${icon("calendar")}${esc(D.when)}</span>`,
    `<span>${icon("pin")}${esc(D.where)}</span>`,
    D.team && `<span>${icon("users")}${esc(D.team)}</span>`,
  ].filter(Boolean);
  const big = D.prize
    ? `<div class="big"><b>${esc(D.prize)}</b><span>prize pool${D.prize_alt ? ` <i>${esc(D.prize_alt)}</i>` : ""}</span></div>`
    : D.registered
      ? `<div class="big"><b>${esc(D.registered)}</b><span>registered so far</span></div>`
      : "";
  const stamp = D.stamp ? `<span class="stamp ${D.stamp.tone}">${esc(D.stamp.label)} · ${esc(D.stamp.date)}</span>` : "";
  const kind = D.kind !== "Hackathon" ? ` · ${esc(D.kind)}` : "";
  document.getElementById("card").innerHTML = `
    <article class="poster ${D.stock}">
      <span class="pin"></span>
      <header class="head">
        ${D.logo ? `<img src="${esc(D.logo)}" alt="">` : ""}
        <div class="letter"><span class="platform">${esc(D.platform)}${kind}</span>${D.organizer ? `<span class="org">${esc(D.organizer)}</span>` : ""}</div>
      </header>
      <h1 class="title">${esc(D.title)}</h1>
      <div class="facts">${facts.join("")}</div>
      <div class="spacer"></div>
      <footer class="foot"><div>${stamp}</div>${big}</footer>
    </article>
    <div class="brand"><span class="wordmark"><span class="pin"></span>Hackmash</span></div>`;
  await document.fonts.ready;
  await Promise.all([...document.images].map((img) => img.decode().catch(() => img.remove())));
  fit(document.querySelector(".title"), 112, 50, 216);
  const b = document.querySelector(".big b");
  if (b) fitLine(b, 96, 56);
};
</script>
</body>
